
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #07030c; font-family: Georgia, "Times New Roman", serif; }
  canvas { position: fixed; inset: 0; display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; pointer-events: none;
  }
  #inicio {
    color: #ffd6e8; font-size: clamp(1.2rem, 4vw, 2rem);
    text-shadow: 0 0 18px #ff4f9a; letter-spacing: 1px;
    animation: latido 2s ease-in-out infinite; pointer-events: auto; cursor: pointer;
  }
  #caja { max-width: 640px; border-radius: 22px; padding: 0; transition: background 1.5s, padding 1.5s; }
  #caja.activa {
    background: radial-gradient(ellipse at center, rgba(10,4,16,0.55) 0%, rgba(10,4,16,0.35) 70%, rgba(10,4,16,0) 100%);
    padding: 26px 30px;
  }
  #mensaje {
    color: #fff0f6; font-size: clamp(1.1rem, 3.6vw, 1.9rem); line-height: 1.6;
    white-space: pre-wrap;
    text-shadow: 0 0 14px #ff4f9a, 0 0 30px #c2185b;
  }
  #firma {
    margin-top: 18px; color: #ffb3d1; font-style: italic;
    font-size: clamp(1rem, 3vw, 1.5rem); opacity: 0; transition: opacity 2s;
    text-shadow: 0 0 12px #ff4f9a;
  }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="inicio">Toca la pantalla, tengo algo para ti 🌹</div>
  <div id="caja">
    <div id="mensaje"></div>
    <div id="firma"></div>
  </div>
</div>
 
<script>
/* ======== PERSONALIZA AQUÍ ======== */
const CONFIG = {
  mensaje:
`Hola, Kiara mi amorcito 🌹
 
Desde que te conocí, mis días se sienten distintos.
Me encanta tu forma de ser y cómo haces que todo se vea más bonito,
contigo todo es bonito.
 
Solo queria recordarte que :
me gustas mucho, cada dia más que el anterior mi princesita, hermosa, guapa.
 
 te quiero mucho amorcito 🌹`,
  firma: "--Tu programador enamorado"
};
/* =================================== */
 
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
 
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
 
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
 
/* ================= PÉTALO REALISTA (forma de curvas) ================= */
function trazoPetalo(c, L, w) {
  c.beginPath();
  c.moveTo(0, 0);
  c.bezierCurveTo(-w * 1.25, -L * 0.28, -w * 1.4, -L * 0.95, 0, -L);
  c.bezierCurveTo(w * 1.4, -L * 0.95, w * 1.25, -L * 0.28, 0, 0);
  c.closePath();
}
 
function dibujarPetalo(c, L, w, hue, sat, blur) {
  // degradado: base oscura -> punta clara
  const g = c.createLinearGradient(0, 0, 0, -L);
  g.addColorStop(0,    `hsla(${hue}, ${sat}%, 22%, 0.97)`);
  g.addColorStop(0.45, `hsla(${hue}, ${sat}%, 46%, 0.95)`);
  g.addColorStop(0.85, `hsla(${hue + 6}, 100%, 68%, 0.95)`);
  g.addColorStop(1,    `hsla(${hue + 10}, 100%, 82%, 0.95)`);
  c.fillStyle = g;
  c.shadowColor = `hsla(${hue}, 100%, 60%, 0.95)`;
  c.shadowBlur = blur;
  trazoPetalo(c, L, w);
  c.fill();
  c.shadowBlur = 0;
 
  // brillo en el borde
  c.strokeStyle = `hsla(${hue + 10}, 100%, 88%, 0.6)`;
  c.lineWidth = 1.3;
  c.stroke();
 
  // venas suaves
  c.strokeStyle = `hsla(${hue}, 80%, 28%, 0.35)`;
  c.lineWidth = 1;
  for (const d of [-0.35, 0, 0.35]) {
    c.beginPath();
    c.moveTo(0, -L * 0.06);
    c.quadraticCurveTo(w * d * 1.2, -L * 0.5, w * d * 1.9, -L * 0.88);
    c.stroke();
  }
}
 
/* ================= SPRITES (se dibujan una vez = fluido) ================= */
const SS = 1.6; // nitidez del sprite
 
function crearFlor(size, hue, n, capas) {
  const R = size + 34;
  const cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil(R * 2 * SS);
  const c = cv.getContext('2d');
  c.scale(SS, SS);
  c.translate(R, R);
  for (let k = 0; k < capas; k++) {
    const L = size * (1 - k * 0.2);
    const nn = Math.max(4, n - k);
    const w = L * (0.3 + k * 0.03);
    const off = k * (Math.PI / n) + k * 0.45;
    for (let i = 0; i < nn; i++) {
      c.save();
      c.rotate((i / nn) * Math.PI * 2 + off + rand(-0.05, 0.05));
      dibujarPetalo(c, L * rand(0.96, 1.04), w, hue + k * 3, 95, 16);
      c.restore();
    }
  }
  c.shadowColor = '#fff3a8'; c.shadowBlur = 20;
  c.fillStyle = 'rgba(255,236,150,0.95)';
  c.beginPath(); c.arc(0, 0, size * 0.1, 0, Math.PI * 2); c.fill();
  return { cv, R };
}
 
function crearRosa(size) {
  const R = size + 40;
  const cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil(R * 2 * SS);
  const c = cv.getContext('2d');
  c.scale(SS, SS);
  c.translate(R, R);
  const hue = 345;
  const capas = [
    { n: 9, L: 1.00, w: 0.30 },
    { n: 8, L: 0.86, w: 0.32 },
    { n: 7, L: 0.72, w: 0.34 },
    { n: 6, L: 0.59, w: 0.37 },
    { n: 5, L: 0.47, w: 0.41 },
    { n: 4, L: 0.36, w: 0.46 },
    { n: 3, L: 0.26, w: 0.52 },
    { n: 3, L: 0.17, w: 0.58 }
  ];
  capas.forEach((cp, k) => {
    for (let i = 0; i < cp.n; i++) {
      c.save();
      c.rotate((i / cp.n) * Math.PI * 2 + k * 0.72 + rand(-0.04, 0.04));
      dibujarPetalo(c, size * cp.L, size * cp.L * cp.w, hue + k * 1.5, 88, 24);
      c.restore();
    }
  });
  // espiral del centro (capullo)
  c.strokeStyle = 'rgba(255,200,220,0.5)';
  c.lineWidth = 1.5;
  c.beginPath();
  for (let t = 0; t < Math.PI * 6; t += 0.1) {
    const r = t * size * 0.013;
    const x = Math.cos(t) * r, y = Math.sin(t) * r;
    t === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.stroke();
  return { cv, R };
}
 
function crearPetaloSuelto(hue) {
  const L = 22, w = 8, R = 34;
  const cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil(R * 2 * SS);
  const c = cv.getContext('2d');
  c.scale(SS, SS);
  c.translate(R, R + L / 2);
  dibujarPetalo(c, L, w, hue, 95, 10);
  return { cv, R };
}
 
/* ================= FLORES ================= */
class Flor {
  constructor(x, delay) {
    const f = clamp(W / 800, 0.7, 1.15);
    this.x = x;
    this.altura = rand(H * 0.3, H * 0.62);
    this.tam = rand(52, 92) * f;
    this.fase = rand(0, Math.PI * 2);
    this.balanceo = rand(10, 26);
    this.t = -delay;
    this.velocidad = rand(0.2, 0.3);
    this.sprite = crearFlor(this.tam, rand(322, 352), Math.round(rand(8, 11)), 4);
  }
  punto(p, tiempo) {
    return {
      x: this.x + Math.sin(p * 2.4 + this.fase + tiempo * 0.0008) * this.balanceo * p,
      y: H - this.altura * p
    };
  }
  dibujar(tiempo, dt) {
    this.t += dt * this.velocidad;
    if (this.t <= 0) return;
    const tallo = clamp(this.t / 0.6, 0, 1);
    const flor = clamp((this.t - 0.5) / 0.5, 0, 1);
 
    // tallo con brillo
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(80,220,140,0.55)';
    ctx.shadowColor = '#3ddc84';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    const pasos = 28;
    for (let i = 0; i <= pasos; i++) {
      const pt = this.punto((i / pasos) * tallo, tiempo);
      i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.restore();
 
    if (flor <= 0) return;
    const cab = this.punto(tallo, tiempo);
    const e = easeOutBack(flor) * (1 + Math.sin(tiempo * 0.002 + this.fase) * 0.03);
    ctx.save();
    ctx.translate(cab.x, cab.y);
    ctx.rotate(Math.sin(tiempo * 0.0007 + this.fase) * 0.12 + (1 - flor) * 0.9);
    ctx.globalAlpha = Math.min(1, flor * 2);
    ctx.scale(e, e);
    ctx.drawImage(this.sprite.cv, -this.sprite.R, -this.sprite.R, this.sprite.R * 2, this.sprite.R * 2);
    ctx.restore();
  }
}
 
/* ================= ROSA GRANDE DE FONDO ================= */
let rosa = null, rosaT = -0.4;
function dibujarRosa(tiempo, dt) {
  rosaT += dt * 0.22;
  if (rosaT <= 0 || !rosa) return;
  const b = easeOutCubic(clamp(rosaT, 0, 1));
  const resp = 1 + Math.sin(tiempo * 0.0013) * 0.025;
  ctx.save();
  ctx.translate(W / 2, H * 0.47);
  ctx.rotate(tiempo * 0.00006 + (1 - b) * 1.2);
  ctx.globalAlpha = 0.68 * b;
  ctx.scale((0.25 + 0.75 * b) * resp, (0.25 + 0.75 * b) * resp);
  ctx.drawImage(rosa.cv, -rosa.R, -rosa.R, rosa.R * 2, rosa.R * 2);
  ctx.restore();
}
 
/* ================= PÉTALOS QUE CAEN ================= */
let spritesPetalo = [];
class Petalo {
  constructor() { this.reiniciar(true); }
  reiniciar(inicio) {
    this.x = rand(0, W);
    this.y = inicio ? rand(-H, H) : rand(-60, -10);
    this.s = rand(0.8, 1.7);
    this.vy = rand(0.45, 1.2);
    this.vx = rand(-0.3, 0.5);
    this.rot = rand(0, Math.PI * 2);
    this.vrot = rand(-0.02, 0.02);
    this.fase = rand(0, Math.PI * 2);
    this.giro = rand(0.01, 0.03);
    this.sprite = spritesPetalo[Math.floor(Math.random() * spritesPetalo.length)];
  }
  dibujar(tiempo) {
    this.y += this.vy;
    this.x += this.vx + Math.sin(tiempo * 0.001 + this.fase) * 0.5;
    this.rot += this.vrot;
    if (this.y > H + 40 || this.x > W + 40 || this.x < -40) this.reiniciar(false);
    const flip = Math.cos(tiempo * this.giro + this.fase); // efecto 3D al girar
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.scale(this.s * (0.25 + 0.75 * Math.abs(flip)), this.s);
    ctx.drawImage(this.sprite.cv, -this.sprite.R, -this.sprite.R, this.sprite.R * 2, this.sprite.R * 2);
    ctx.restore();
  }
}
 
/* ================= ESTRELLAS ================= */
const estrellas = Array.from({ length: 90 }, () => ({
  x: Math.random(), y: Math.random() * 0.8, r: rand(0.4, 1.4), f: rand(0, 6.28)
}));
 
/* ================= INICIO ================= */
let flores = [], petalos = [];
function iniciar() {
  resize();
  rosa = crearRosa(Math.min(W, H) * 0.46);
  rosaT = -0.4;
  spritesPetalo = [330, 338, 345, 352].map(crearPetaloSuelto);
  const n = Math.max(5, Math.round(W / 150));
  flores = Array.from({ length: n }, (_, i) =>
    new Flor((i + 0.5) * (W / n) + rand(-25, 25), rand(0, 4)));
  petalos = Array.from({ length: Math.round(W / 38) + 14 }, () => new Petalo());
}
iniciar();
 
let tResize;
window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(iniciar, 250); });
 
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min((ahora - ultimo) / 1000, 0.05);
  ultimo = ahora;
 
  ctx.globalCompositeOperation = 'source-over';
  const fondo = ctx.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, '#0b0414');
  fondo.addColorStop(1, '#1d0a22');
  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, W, H);
 
  for (const e of estrellas) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 + Math.sin(ahora * 0.002 + e.f) * 0.3})`;
    ctx.fillRect(e.x * W, e.y * H, e.r, e.r);
  }
 
  dibujarRosa(ahora, dt);
  flores.forEach(f => f.dibujar(ahora, dt));
  petalos.forEach(p => p.dibujar(ahora));
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
 
/* ================= MENSAJE ================= */
const inicio = document.getElementById('inicio');
const caja = document.getElementById('caja');
const mensajeEl = document.getElementById('mensaje');
const firmaEl = document.getElementById('firma');
let escribiendo = false;
 
function escribir() {
  if (escribiendo) return;
  escribiendo = true;
  inicio.style.display = 'none';
  caja.classList.add('activa');
  let i = 0;
  const texto = CONFIG.mensaje;
  const intervalo = setInterval(() => {
    mensajeEl.textContent = texto.slice(0, ++i);
    if (i >= texto.length) {
      clearInterval(intervalo);
      firmaEl.textContent = CONFIG.firma;
      setTimeout(() => (firmaEl.style.opacity = 1), 300);
    }
  }, 55);
}
window.addEventListener('click', escribir);
window.addEventListener('touchstart', escribir, { passive: true });
</script>
</body>
</html>
